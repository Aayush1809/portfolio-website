<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Contact Jane Doe | Accessible Web Development Services</title>
    <meta name="description" content="Get in touch with Jane Doe for front-end engineering, accessibility audits, and semantic HTML consultations.">
    <link rel="canonical" href="https://www.janedoedeveloper.com/contact.html">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo" aria-label="Jane Doe Portfolio Home">Jane Doe</a>
            <nav aria-label="Main Navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section id="contact-section" aria-labelledby="contact-heading">
            <h1 id="contact-heading">Let's Build Something Together</h1>
            <p>Fill out the form below, and I will get back to you within 2 business days.</p>

            <form action="#" method="POST" class="contact-form" novalidate>
                
                <div class="form-group">
                    <label id="name-label" for="user-name">Full Name <span class="required" aria-hidden="true">*</span></label>
                    <input 
                        type="text" 
                        id="user-name" 
                        name="name" 
                        required 
                        autocomplete="name"
                        aria-required="true"
                        aria-labelledby="name-label">
                </div>

                <div class="form-group">
                    <label id="email-label" for="user-email">Email Address <span class="required" aria-hidden="true">*</span></label>
                    <input 
                        type="email" 
                        id="user-email" 
                        name="email" 
                        required 
                        autocomplete="email"
                        aria-required="true"
                        aria-labelledby="email-label"
                        aria-describedby="email-hint">
                    <small id="email-hint" class="form-hint">Example: name@domain.com</small>
                </div>

                <div class="form-group">
                    <label id="message-label" for="user-message">Message <span class="required" aria-hidden="true">*</span></label>
                    <textarea 
                        id="user-message" 
                        name="message" 
                        rows="6" 
                        required 
                        aria-required="true"
                        aria-labelledby="message-label"></textarea>
                </div>

                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Jane Doe. All rights reserved.</p>
            <nav aria-label="Social Media Links">
                <ul>
                    <li><a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="Jane Doe's LinkedIn Profile">LinkedIn</a></li>
                    <li><a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="Jane Doe's GitHub Profile">GitHub</a></li>
                </ul>
            </nav>
        </div>
    </footer>

</body>
</html>
